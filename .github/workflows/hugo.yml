# Builds the site with a custom Hugo and deploys it to GitHub Pages.
#
# Hugo is compiled from source so that Chroma, its syntax highlighter, includes
# the lexers in lexers/ (ACL2 is not in upstream Chroma; coq.xml overrides the
# upstream Coq lexer). The compiled binary is cached, keyed on the Hugo version
# and the lexer files, so it is only rebuilt when one of those changes.
name: Deploy Hugo site to Pages

on:
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  # Chroma is built at whatever version this Hugo release depends on.
  HUGO_VERSION: v0.170.1

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore cached Hugo
        id: hugo-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo-bin
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('lexers/**') }}

      - name: Fetch Hugo and Chroma sources
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$HUGO_VERSION" https://github.com/gohugoio/hugo.git "$RUNNER_TEMP/hugo"
          chroma_version=$(awk '$1 == "github.com/alecthomas/chroma/v2" { print $2 }' "$RUNNER_TEMP/hugo/go.mod")
          git clone --depth 1 --branch "$chroma_version" https://github.com/alecthomas/chroma.git "$RUNNER_TEMP/chroma"
          cp -f lexers/* "$RUNNER_TEMP/chroma/lexers/embedded/"

      - name: Set up Go
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/hugo/go.mod
          cache-dependency-path: ${{ runner.temp }}/hugo/go.sum

      - name: Build Hugo with the custom lexers
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          cd "$RUNNER_TEMP/hugo"
          go mod edit -replace "github.com/alecthomas/chroma/v2=$RUNNER_TEMP/chroma"
          go build -o "$RUNNER_TEMP/hugo-bin/hugo" .

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          "$RUNNER_TEMP/hugo-bin/hugo" version
          "$RUNNER_TEMP/hugo-bin/hugo" \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
